[project]
name = "rocket-chat"
version = "0.3.1"
description = "Autonomous AI pair-programming platform"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "sandbox-driver",
    "llm-gateway",
    "agent-core",
    "slack-assistant",
    "git-engine",
    "config-engine",
    "mcp-runner",
    "api",
    "pgvector>=0.5.0",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/api",
]

[tool.uv.sources]
sandbox-driver = { workspace = true }
llm-gateway = { workspace = true }
agent-core = { workspace = true }
slack-assistant = { workspace = true }
git-engine = { workspace = true }
config-engine = { workspace = true }
mcp-runner = { workspace = true }
api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-docker>=7.0.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "cryptography>=43.0.0",
    "pyjwt[crypto]>=2.9.0",
    "types-authlib>=1.3",
    "types-pyyaml>=6.0",
    "types-croniter>=6.0",
    "asyncpg-stubs>=0.31.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Pin loop scoping explicitly: every test (and every async fixture) gets its own
# event loop, which is what keeps engine pools from leaking across tests.
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "setting(key): the test proves that the registry setting \"domain.key\" changes runtime behaviour",
]
pythonpath = [
    ".",
    "packages/sandbox-driver/src",
    "packages/llm-gateway/src",
    "packages/agent-core/src",
    "packages/slack-assistant/src",
    "packages/git-engine/src",
    "packages/config-engine/src",
    "packages/mcp-runner/src",
    "apps/api/src",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ".:packages/sandbox-driver/src:packages/llm-gateway/src:packages/agent-core/src:packages/slack-assistant/src:packages/git-engine/src:packages/config-engine/src:packages/mcp-runner/src:apps/api/src"
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
