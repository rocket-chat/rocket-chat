target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]

[lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ASYNC",  # flake8-async
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # Line length handled by formatter
    "UP042",  # Allow str, Enum for standard enum serialization
]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

