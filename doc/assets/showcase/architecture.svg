<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrow-brand" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fe5825"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#0f1117"/>

  <text x="60" y="70" fill="#f9fafb" font-size="30" font-weight="700">Rocket Chat, one sandbox per conversation</text>
  <text x="60" y="104" fill="#9ca3af" font-size="18">The agent works in a throwaway machine that never holds your GitHub token.</text>

  <!-- People -->
  <g>
    <rect x="60" y="170" width="220" height="90" rx="14" fill="#1a1d27" stroke="#2d3240"/>
    <text x="170" y="208" fill="#f9fafb" font-size="20" font-weight="600" text-anchor="middle">Browser cockpit</text>
    <text x="170" y="236" fill="#9ca3af" font-size="15" text-anchor="middle">watch, steer, approve</text>
    <rect x="60" y="290" width="220" height="90" rx="14" fill="#1a1d27" stroke="#2d3240"/>
    <text x="170" y="328" fill="#f9fafb" font-size="20" font-weight="600" text-anchor="middle">Slack threads</text>
    <text x="170" y="356" fill="#9ca3af" font-size="15" text-anchor="middle">Teams, Mattermost too</text>
  </g>

  <!-- Control plane -->
  <rect x="360" y="150" width="330" height="250" rx="18" fill="#1a1d27" stroke="#fe5825" stroke-width="2"/>
  <text x="525" y="192" fill="#f9fafb" font-size="22" font-weight="700" text-anchor="middle">Control plane</text>
  <text x="525" y="222" fill="#9ca3af" font-size="15" text-anchor="middle">your server or Kubernetes cluster</text>
  <g font-size="16" fill="#e5e7eb">
    <text x="390" y="262">• agents, roles, spend limits</text>
    <text x="390" y="292">• any model provider, or your own</text>
    <text x="390" y="322">• turns that survive restarts</text>
    <text x="390" y="352">• waits on CI of the pushed commit</text>
    <text x="390" y="382">• audit trail, PostgreSQL RLS</text>
  </g>

  <!-- Sandboxes -->
  <g>
    <rect x="800" y="140" width="330" height="80" rx="14" fill="#1a1d27" stroke="#2d3240"/>
    <text x="830" y="176" fill="#f9fafb" font-size="18" font-weight="600">Sandbox · conversation A</text>
    <text x="830" y="202" fill="#9ca3af" font-size="14">your image · clone · test · edit · preview</text>
    <rect x="800" y="235" width="330" height="80" rx="14" fill="#1a1d27" stroke="#2d3240"/>
    <text x="830" y="271" fill="#f9fafb" font-size="18" font-weight="600">Sandbox · conversation B</text>
    <text x="830" y="297" fill="#9ca3af" font-size="14">sleeps when idle, released when done</text>
    <rect x="800" y="330" width="330" height="80" rx="14" fill="#1a1d27" stroke="#2d3240"/>
    <text x="830" y="366" fill="#f9fafb" font-size="18" font-weight="600">Sandbox · subagent</text>
    <text x="830" y="392" fill="#9ca3af" font-size="14">parallel work in its own worktree</text>
  </g>

  <!-- GitHub -->
  <rect x="360" y="470" width="770" height="100" rx="18" fill="#161922" stroke="#2d3240"/>
  <text x="400" y="512" fill="#f9fafb" font-size="20" font-weight="700">GitHub / GitLab</text>
  <text x="400" y="542" fill="#9ca3af" font-size="15">pull requests, review threads, CI logs</text>
  <text x="790" y="512" fill="#e5e7eb" font-size="16">read-only gateway in</text>
  <text x="790" y="542" fill="#fe5825" font-size="16" font-weight="600">signed commits out, from the platform</text>

  <!-- Arrows -->
  <line x1="280" y1="215" x2="355" y2="245" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="335" x2="355" y2="305" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="200" x2="795" y2="180" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="275" x2="795" y2="275" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="350" x2="795" y2="370" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="525" y1="400" x2="525" y2="465" stroke="#fe5825" stroke-width="2.5" marker-end="url(#arrow-brand)"/>
  <line x1="965" y1="465" x2="965" y2="415" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/>
</svg>
