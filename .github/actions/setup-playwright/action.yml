name: Set up Playwright
description: Chromium with the browser download cached; system libraries are always installed (they live outside the cache).
runs:
  using: composite
  steps:
    - name: Cache browsers
      id: browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - name: Install Chromium and its system libraries
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter web exec playwright install --with-deps chromium
    - name: Install the system libraries only
      if: steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: pnpm --filter web exec playwright install-deps chromium
