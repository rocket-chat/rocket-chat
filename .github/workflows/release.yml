name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  # Fail in seconds, before any image is built: the manifests agree with each other and with the
  # tag, and the changelog has notes for this version.
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tags: ${{ steps.plan.outputs.tags }}
      primary: ${{ steps.plan.outputs.primary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Manifests, tag and changelog agree
        run: |
          python3 scripts/release.py check
          python3 scripts/release.py notes "${GITHUB_REF_NAME#v}" --output "$RUNNER_TEMP/notes.md"
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert version == tag, f"tag v{tag} does not match the manifests ({version})"
          PY
      - name: Plan the image tags
        id: plan
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags="$version"
          # A pre-release (1.0.0-rc.1) never moves `latest`.
          [[ "$version" == *-* ]] || tags="$version"$'\n'"latest"
          {
            echo "version=$version"
            echo "primary=$version"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ---- container images: native amd64 and arm64 builds, one job per image, all in parallel ----

  backend:
    needs: verify
    uses: ./.github/workflows/image.yml
    with:
      image: backend
      file: deploy/docker/Dockerfile.backend
      tags: ${{ needs.verify.outputs.tags }}
      build-args: ROCKET_VERSION=${{ needs.verify.outputs.version }}

  frontend:
    needs: verify
    uses: ./.github/workflows/image.yml
    with:
      image: frontend
      file: deploy/docker/Dockerfile.frontend
      tags: ${{ needs.verify.outputs.tags }}

  mcp-runner:
    needs: verify
    uses: ./.github/workflows/image.yml
    with:
      image: mcp-runner
      file: deploy/docker/Dockerfile.mcp-runner
      tags: ${{ needs.verify.outputs.tags }}

  # The agent workspace images: the devbox every session starts from, and the variant with a
  # headless browser for the `browser_inspect` tool.
  sandbox:
    needs: verify
    uses: ./.github/workflows/image.yml
    with:
      image: sandbox
      file: deploy/docker/Dockerfile.sandbox
      tags: ${{ needs.verify.outputs.tags }}

  sandbox-browser:
    needs: [verify, sandbox]
    uses: ./.github/workflows/image.yml
    with:
      image: sandbox-browser
      file: deploy/docker/Dockerfile.sandbox-browser
      tags: ${{ needs.verify.outputs.tags }}
      build-args: BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/sandbox:${{ needs.verify.outputs.primary }}

  sandbox-polyglot:
    needs: [verify, sandbox]
    uses: ./.github/workflows/image.yml
    with:
      image: sandbox-polyglot
      file: deploy/docker/Dockerfile.sandbox-polyglot
      tags: ${{ needs.verify.outputs.tags }}
      build-args: BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/sandbox:${{ needs.verify.outputs.primary }}

  helm:
    name: Package & push the OCI Helm chart
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: "v3.15.0"
      - uses: oras-project/setup-oras@v1
      - name: Package and push the chart
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          helm package deploy/helm/platform --version "$VERSION" --app-version "$VERSION" \
            --destination .cr-release-packages
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push .cr-release-packages/*.tgz "oci://ghcr.io/$OWNER/charts"
      - name: Push Artifact Hub metadata (verified publisher)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "$REGISTRY_TOKEN" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          oras push "ghcr.io/$OWNER/charts/rocket-chat:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  sbom:
    name: Software bill of materials
    needs: [verify, backend, frontend, mcp-runner, sandbox, sandbox-browser, sandbox-polyglot]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The lockfile SBOM is the authoritative, deterministic artifact: it needs no external
      # scanner, so a green release never depends on a third-party tool.
      - name: Lockfile SBOM (CycloneDX)
        run: python3 scripts/generate_sbom.py --output sbom/rocket-chat-source.cdx.json
      # Best-effort OS-package layer of each published image; a registry hiccup must not block the
      # release because the lockfile SBOM already satisfies the supply-chain requirement.
      - name: Image SBOMs
        continue-on-error: true
        env:
          TAG: ${{ needs.verify.outputs.primary }}
          OWNER: ${{ github.repository_owner }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$RUNNER_TEMP/bin"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for image in backend frontend mcp-runner sandbox sandbox-browser sandbox-polyglot; do
            "$RUNNER_TEMP/bin/syft" "ghcr.io/$OWNER/$image:$TAG" -o spdx-json="sbom/$image-image.spdx.json" &
          done
          wait
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  github-release:
    name: Publish the GitHub release
    needs: [verify, backend, frontend, mcp-runner, sandbox, sandbox-browser, helm, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Release notes from the changelog
        run: python3 scripts/release.py notes "${GITHUB_REF_NAME#v}" --output "$RUNNER_TEMP/RELEASE_NOTES.md"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            deploy/docker-compose.prod.yml
            sbom/*.json
          generate_release_notes: false
