<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" shape-rendering="geometricPrecision">
  <defs>
    <!-- Background Vignette Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>

    <!-- Badge Rim Metallic Gradient -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a354b" />
      <stop offset="100%" stop-color="#131926" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="1.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Drop Shadow for Rocket Elevation -->
    <filter id="badge-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- App Badge Squircle -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="url(#bg-grad)" stroke="url(#rim-grad)" stroke-width="6" />

  <!-- Rocket Main Group: Centered & Rotated 45° with Drop Shadow -->
  <g transform="rotate(45 256 256)" filter="url(#badge-shadow)">

    <!-- ================= 1. PROPULSION FLAME ================= -->
    <!-- Outer Flame Body (#ff5722) -->
    <path d="M 230 330 
             C 216 358 226 394 256 422 
             C 286 394 296 358 282 330 
             C 272 344 266 350 256 350 
             C 246 350 240 344 230 330 Z" 
          fill="#ff5722" />
    <!-- Inner Flame Void Cutout (#0b0d13 matching badge) -->
    <path d="M 242 342 
             C 236 360 244 380 256 394 
             C 268 380 276 360 270 342 
             C 264 350 260 354 256 354 
             C 252 354 248 350 242 342 Z" 
          fill="#0b0d13" />

    <!-- ================= 2. WINGS & FINS ================= -->
    <!-- Left Swept Wing Dark Body -->
    <polygon points="214,242 142,284 154,324 216,280" fill="#222b3d" />
    <!-- Left Wing Neon Cyan Leading Bevel -->
    <polygon points="142,284 214,242 208,238 136,278" fill="#00e5ff" filter="url(#neon-glow)" />

    <!-- Right Swept Wing Dark Body -->
    <polygon points="298,242 370,284 358,324 296,280" fill="#222b3d" />
    <!-- Right Wing Neon Cyan Trailing Bevel -->
    <polygon points="370,284 358,324 352,320 364,282" fill="#00e5ff" filter="url(#neon-glow)" />

    <!-- ================= 3. ENGINE THRUSTER COLLAR ================= -->
    <!-- Dark Metallic Engine Mount -->
    <polygon points="234,302 278,302 272,334 240,334" fill="#182030" stroke="#0e131d" stroke-width="2" />
    <!-- Center Segment Divider -->
    <line x1="256" y1="302" x2="256" y2="334" stroke="#0b0d13" stroke-width="3" />

    <!-- ================= 4. MAIN FUSELAGE ================= -->
    <!-- Solid Pure White Body with Bottom Prongs & Notched Base -->
    <path d="M 256 86 
             C 214 150 210 240 212 308 
             L 226 308 
             L 236 280 
             L 246 294 
             L 256 264 
             L 266 294 
             L 276 280 
             L 286 308 
             L 300 308 
             C 302 240 298 150 256 86 Z" 
          fill="#ffffff" />

    <!-- Right Side Metallic Facet / Shadow Shading -->
    <path d="M 256 86 
             C 278 140 286 216 286 308 
             L 300 308 
             C 302 240 298 150 256 86 Z" 
          fill="#dce3ec" />

    <!-- Center Base Chevron Shadow -->
    <polygon points="246,294 256,264 266,294 256,282" fill="#bac7d5" />

    <!-- Nose Cone Metallic Facet Cap -->
    <path d="M 256 86 
             C 246 114 238 138 234 162 
             L 278 162 
             C 274 138 266 114 256 86 Z" 
          fill="#3b4861" />

    <!-- ================= 5. COCKPIT TELEMETRY SENSOR ================= -->
    <!-- Outer Deep Void Well -->
    <circle cx="256" cy="204" r="22" fill="#0b0d13" />
    <!-- Inner Dark Grey Housing -->
    <circle cx="256" cy="204" r="14" fill="#20293a" />
    <!-- Glowing Neon Cyan Sensor Core -->
    <circle cx="256" cy="204" r="7.5" fill="#00e5ff" filter="url(#neon-glow)" />

  </g>
</svg>
