[project]
name = "api"
version = "0.2.1"
description = "Rocket Chat FastAPI Control Plane & Service Host"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "slack-assistant",
    "agent-core",
    "sandbox-driver",
    "llm-gateway",
    "config-engine",
    "pydantic>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "cryptography>=43.0.0",
    "pyjwt[crypto]>=2.9.0",
    "httpx>=0.27.0",
    "pgvector>=0.3.0",
    "authlib>=1.8.0",
    "python-multipart>=0.0.9",
    "joserfc>=1.0",
    "argon2-cffi>=23.1",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "pyyaml>=6.0.3",
    "croniter>=6.2.4",
    "json5>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[dependency-groups]
dev = [
    "types-croniter>=6.2.4.20261006",
    "types-pyyaml>=6.0.12.20260906",
]
