[project]
name = "api"
version = "0.1.4"
description = "Rocket Chat FastAPI Control Plane & Service Host"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "slack-assistant",
    "agent-core",
    "sandbox-driver",
    "llm-gateway",
    "config-engine",
    "pydantic>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "cryptography>=43.0.0",
    "pyjwt[crypto]>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
