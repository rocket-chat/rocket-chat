kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: rocket-local
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8000
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30000
        hostPort: 3000
        listenAddress: "127.0.0.1"
        protocol: TCP
