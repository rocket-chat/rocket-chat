{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rocket-chat.fullname" . }}-postgres-init
  labels:
    {{- include "rocket-chat.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
data:
  init-rls.sql: |
    CREATE EXTENSION IF NOT EXISTS vector;
    DO $$
    BEGIN
        IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .Values.postgresql.appUsername | default "rocket_app" }}') THEN
            CREATE ROLE {{ .Values.postgresql.appUsername | default "rocket_app" }} WITH LOGIN PASSWORD '{{ .Values.postgresql.password }}';
        ELSE
            ALTER ROLE {{ .Values.postgresql.appUsername | default "rocket_app" }} WITH PASSWORD '{{ .Values.postgresql.password }}';
        END IF;
    END
    $$;
    GRANT ALL PRIVILEGES ON DATABASE {{ .Values.postgresql.database | default "rocket_chat" }} TO {{ .Values.postgresql.appUsername | default "rocket_app" }};
    GRANT ALL PRIVILEGES ON SCHEMA public TO {{ .Values.postgresql.appUsername | default "rocket_app" }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO {{ .Values.postgresql.appUsername | default "rocket_app" }};
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO {{ .Values.postgresql.appUsername | default "rocket_app" }};
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "rocket-chat.fullname" . }}-postgres
  labels:
    {{- include "rocket-chat.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "rocket-chat.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "rocket-chat.name" . }}-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "rocket-chat.name" . }}-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | default "rocket_chat" | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | default "postgres" | quote }}
            {{- if .Values.postgresql.existingSecret }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.existingSecret }}
                  key: {{ .Values.postgresql.existingSecretPasswordKey | default "POSTGRES_PASSWORD" }}
            {{- else }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.password | quote }}
            {{- end }}
          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.username | default "postgres" }}
                - -d
                - {{ .Values.postgresql.database | default "rocket_chat" }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.username | default "postgres" }}
                - -d
                - {{ .Values.postgresql.database | default "rocket_chat" }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: init-script
          configMap:
            name: {{ include "rocket-chat.fullname" . }}-postgres-init
        {{- if not .Values.postgresql.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "rocket-chat.labels" . | nindent 10 }}
          app.kubernetes.io/component: postgres
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ .Values.postgresql.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size | default "10Gi" }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rocket-chat.fullname" . }}-postgres
  labels:
    {{- include "rocket-chat.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "rocket-chat.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
