{{- if .Values.mcpRunner.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rocket-chat.fullname" . }}-mcp-runner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rocket-chat.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-runner
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8100
      targetPort: http
      protocol: TCP
  selector:
    {{- include "rocket-chat.mcpRunnerSelectorLabels" . | nindent 4 }}
{{- end }}
