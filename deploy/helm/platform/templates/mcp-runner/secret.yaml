{{- if and .Values.mcpRunner.enabled (not .Values.mcpRunner.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rocket-chat.mcpRunnerSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rocket-chat.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-runner
type: Opaque
stringData:
  MCP_RUNNER_TOKEN: {{ include "rocket-chat.mcpRunnerToken" . | quote }}
{{- end }}
