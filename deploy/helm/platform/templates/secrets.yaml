apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rocket-chat.fullname" . }}-secrets
  labels:
    {{- include "rocket-chat.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.backend.database.existingSecret }}
    {{- if .Values.postgresql.enabled }}
      {{- if not .Values.postgresql.existingSecret }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s-postgres:5432/%s" (.Values.postgresql.appUsername | default "rocket_app") (.Values.postgresql.password | default "postgres_prod_password") (include "rocket-chat.fullname" .) (.Values.postgresql.database | default "rocket_chat") | quote }}
  ADMIN_DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s-postgres:5432/%s" (.Values.postgresql.username | default "postgres") (.Values.postgresql.password | default "postgres_prod_password") (include "rocket-chat.fullname" .) (.Values.postgresql.database | default "rocket_chat") | quote }}
      {{- end }}
    {{- else }}
  DATABASE_URL: {{ .Values.backend.database.url | quote }}
  ADMIN_DATABASE_URL: {{ .Values.backend.database.adminUrl | default .Values.backend.database.url | quote }}
    {{- end }}
  {{- end }}
  {{- if and .Values.backend.encryption.masterKey (not .Values.backend.encryption.existingSecret) }}
  ENCRYPTION_MASTER_KEY: {{ .Values.backend.encryption.masterKey | quote }}
  {{- end }}
  {{- if and .Values.backend.slack.botToken (not .Values.backend.slack.existingSecret) }}
  SLACK_BOT_TOKEN: {{ .Values.backend.slack.botToken | quote }}
  {{- end }}
  {{- if and .Values.backend.slack.appToken (not .Values.backend.slack.existingSecret) }}
  SLACK_APP_TOKEN: {{ .Values.backend.slack.appToken | quote }}
  {{- end }}
  {{- if and .Values.models.openrouter.apiKey (not .Values.models.openrouter.existingSecret) }}
  OPENROUTER_API_KEY: {{ .Values.models.openrouter.apiKey | toString | trim | quote }}
  {{- end }}
  {{- if and .Values.models.anthropic.apiKey (not .Values.models.anthropic.existingSecret) }}
  ANTHROPIC_API_KEY: {{ .Values.models.anthropic.apiKey | toString | trim | quote }}
  {{- end }}
  {{- if and .Values.models.openai.apiKey (not .Values.models.openai.existingSecret) }}
  OPENAI_API_KEY: {{ .Values.models.openai.apiKey | toString | trim | quote }}
  {{- end }}
  {{- if and .Values.models.deepseek.apiKey (not .Values.models.deepseek.existingSecret) }}
  DEEPSEEK_API_KEY: {{ .Values.models.deepseek.apiKey | toString | trim | quote }}
  {{- end }}
  {{- if and .Values.models.gemini.apiKey (not .Values.models.gemini.existingSecret) }}
  GEMINI_API_KEY: {{ .Values.models.gemini.apiKey | toString | trim | quote }}
  {{- end }}
  {{- if and .Values.github.appId (not .Values.github.existingSecret) }}
  GITHUB_APP_ID: {{ .Values.github.appId | quote }}
  {{- end }}
  {{- if and .Values.github.privateKey (not .Values.github.existingSecret) }}
  GITHUB_APP_PRIVATE_KEY: {{ .Values.github.privateKey | quote }}
  {{- end }}
  {{- if and .Values.github.webhookSecret (not .Values.github.existingSecret) }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.github.webhookSecret | quote }}
  {{- end }}
  {{- if and .Values.github.token (not .Values.github.existingSecret) }}
  GITHUB_TOKEN: {{ .Values.github.token | quote }}
  {{- end }}
