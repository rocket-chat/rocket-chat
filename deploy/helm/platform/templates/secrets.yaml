apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rocket-chat.fullname" . }}-secrets
  labels:
    {{- include "rocket-chat.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s-postgres:5432/%s" (.Values.postgresql.appUsername | default "rocket_app") .Values.postgresql.password (include "rocket-chat.fullname" .) (.Values.postgresql.database | default "rocket_chat") | quote }}
  ADMIN_DATABASE_URL: {{ printf "postgresql+asyncpg://%s:%s@%s-postgres:5432/%s" (.Values.postgresql.username | default "postgres") .Values.postgresql.password (include "rocket-chat.fullname" .) (.Values.postgresql.database | default "rocket_chat") | quote }}
  {{- else }}
  DATABASE_URL: {{ .Values.backend.database.url | quote }}
  ADMIN_DATABASE_URL: {{ .Values.backend.database.adminUrl | default .Values.backend.database.url | quote }}
  {{- end }}
  ENCRYPTION_MASTER_KEY: {{ .Values.backend.encryption.masterKey | quote }}
  SLACK_BOT_TOKEN: {{ .Values.backend.slack.botToken | quote }}
  SLACK_APP_TOKEN: {{ .Values.backend.slack.appToken | quote }}
  OPENROUTER_API_KEY: {{ .Values.backend.openrouterApiKey | default "" | quote }}
