{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rocket-chat.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rocket-chat.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: {{ printf "%s-frontend" (include "rocket-chat.fullname" $) }}
                port:
                  number: 3000
          {{- range .paths }}
          {{- if ne .path "/api/auth" }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ printf "%s-%s" (include "rocket-chat.fullname" $) .service }}
                port:
                  number: {{ eq .service "backend" | ternary 8000 3000 }}
          {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
