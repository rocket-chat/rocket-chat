apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rocket-chat.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rocket-chat.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas | default 2 }}
  selector:
    matchLabels:
      {{- include "rocket-chat.frontendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rocket-chat.frontendSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: NEXTAUTH_URL
              {{- $scheme := "http" }}
              {{- if or (and .Values.ingress (not (empty .Values.ingress.tls))) (hasPrefix "https" (default "" .Values.auth.nextauthUrl)) }}
                {{- $scheme = "https" }}
              {{- end }}
              value: {{ .Values.auth.nextauthUrl | default (printf "%s://%s" $scheme .Values.global.domain) | quote }}
            - name: AUTH_TRUST_HOST
              value: "true"
            {{- if and .Values.auth .Values.auth.enabled }}
            {{- if .Values.auth.existingSecret }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.existingSecretNextAuthKey | default "NEXTAUTH_SECRET" }}
            {{- else if .Values.auth.nextauthSecret }}
            - name: NEXTAUTH_SECRET
              value: {{ .Values.auth.nextauthSecret | quote }}
            {{- end }}
            {{- if .Values.auth.oidc.clientSecret }}
            - name: OIDC_CLIENT_SECRET
              value: {{ .Values.auth.oidc.clientSecret | quote }}
            {{- else if .Values.auth.oidc.existingSecret }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.existingSecret }}
                  key: {{ .Values.auth.oidc.existingSecretClientSecretKey | default "OIDC_CLIENT_SECRET" }}
            {{- end }}
            {{- if .Values.auth.github.clientSecret }}
            - name: GITHUB_CLIENT_SECRET
              value: {{ .Values.auth.github.clientSecret | quote }}
            {{- else if .Values.auth.github.existingSecret }}
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.github.existingSecret }}
                  key: {{ .Values.auth.github.existingSecretClientSecretKey | default "GITHUB_CLIENT_SECRET" }}
            {{- end }}
            {{- if and .Values.auth.google .Values.auth.google.clientSecret }}
            - name: GOOGLE_CLIENT_SECRET
              value: {{ .Values.auth.google.clientSecret | quote }}
            {{- else if and .Values.auth.google .Values.auth.google.existingSecret }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.google.existingSecret }}
                  key: {{ .Values.auth.google.existingSecretClientSecretKey | default "GOOGLE_CLIENT_SECRET" }}
            {{- end }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "rocket-chat.fullname" . }}-config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
