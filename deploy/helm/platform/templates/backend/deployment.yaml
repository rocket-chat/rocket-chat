apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rocket-chat.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rocket-chat.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas | default 1 }}
  {{- end }}
  # maxUnavailable: 0 keeps serving capacity during a rollout; the surge pod absorbs
  # the new revision before an old pod is terminated.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "rocket-chat.backendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
      labels:
        {{- include "rocket-chat.backendSelectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "rocket-chat.serviceAccountName" . }}
      # Drain grace period: the preStop hook flips /v1/ready to failing so the pod
      # leaves the Service before SIGTERM, then in-flight turns finish here.
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds | default 60 }}
      {{- if .Values.backend.migrations.enabled }}
      # Alembic is the only schema path. It runs once per rollout, as the schema
      # owner, before any new backend pod serves; concurrent replicas queue on an advisory lock.
      initContainers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default "IfNotPresent" }}
          command: ["/app/deploy/docker/migrate.sh"]
          envFrom:
            - configMapRef:
                name: {{ include "rocket-chat.fullname" . }}-config
            - secretRef:
                name: {{ include "rocket-chat.fullname" . }}-secrets
          {{- if .Values.backend.database.existingSecret }}
          env:
            {{- include "rocket-chat.databaseEnv" . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "rocket-chat.fullname" . }}-config
            - secretRef:
                name: {{ include "rocket-chat.fullname" . }}-secrets
            {{- if .Values.backend.extraSecretRefs }}
            {{- range .Values.backend.extraSecretRefs }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- end }}
          {{- $hasEnv := false }}
          {{- if or .Values.backend.database.existingSecret (and .Values.auth.local .Values.auth.local.enabled .Values.auth.local.existingSecret) .Values.backend.encryption.existingSecret (and .Values.auth .Values.auth.enabled) .Values.auth.existingSecret .Values.backend.slack.existingSecret .Values.github.existingSecret .Values.models.openrouter.existingSecret .Values.models.anthropic.existingSecret .Values.models.openai.existingSecret .Values.models.deepseek.existingSecret .Values.models.gemini.existingSecret .Values.backend.extraEnv .Values.mcpRunner.enabled }}
          {{- $hasEnv = true }}
          {{- end }}
          {{- if $hasEnv }}
          env:
            {{- include "rocket-chat.databaseEnv" . | nindent 12 }}
            {{- if .Values.mcpRunner.enabled }}
            - name: MCP_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rocket-chat.mcpRunnerSecretName" . }}
                  key: {{ .Values.mcpRunner.existingSecretKey | default "MCP_RUNNER_TOKEN" }}
            {{- end }}
            {{- if and .Values.auth.local .Values.auth.local.enabled .Values.auth.local.existingSecret }}
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.local.existingSecret }}
                  key: {{ .Values.auth.local.existingSecretKey | default "INITIAL_ADMIN_PASSWORD" }}
            {{- end }}
            {{- if .Values.backend.encryption.existingSecret }}
            - name: ENCRYPTION_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.encryption.existingSecret }}
                  key: {{ .Values.backend.encryption.existingSecretKey | default "ENCRYPTION_MASTER_KEY" }}
            {{- end }}
            {{- if .Values.auth.existingSecret }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.existingSecretNextAuthKey | default "NEXTAUTH_SECRET" }}
            {{- end }}
            {{- if and .Values.auth .Values.auth.enabled }}
            {{- if .Values.auth.existingSecret }}
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret }}
                  key: {{ .Values.auth.existingSecretNextAuthKey | default "NEXTAUTH_SECRET" }}
            {{- else if .Values.auth.nextauthSecret }}
            - name: NEXTAUTH_SECRET
              value: {{ .Values.auth.nextauthSecret | quote }}
            {{- end }}
            {{- if .Values.auth.oidc.clientSecret }}
            - name: OIDC_CLIENT_SECRET
              value: {{ .Values.auth.oidc.clientSecret | quote }}
            {{- else if .Values.auth.oidc.existingSecret }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.existingSecret }}
                  key: {{ .Values.auth.oidc.existingSecretClientSecretKey | default "OIDC_CLIENT_SECRET" }}
            {{- end }}
            {{- if .Values.auth.github.clientSecret }}
            - name: GITHUB_CLIENT_SECRET
              value: {{ .Values.auth.github.clientSecret | quote }}
            {{- else if .Values.auth.github.existingSecret }}
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.github.existingSecret }}
                  key: {{ .Values.auth.github.existingSecretClientSecretKey | default "GITHUB_CLIENT_SECRET" }}
            {{- end }}
            {{- if .Values.auth.google.clientSecret }}
            - name: GOOGLE_CLIENT_SECRET
              value: {{ .Values.auth.google.clientSecret | quote }}
            {{- else if .Values.auth.google.existingSecret }}
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.google.existingSecret }}
                  key: {{ .Values.auth.google.existingSecretClientSecretKey | default "GOOGLE_CLIENT_SECRET" }}
            {{- end }}
            {{- end }}
            {{- if .Values.backend.slack.existingSecret }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.slack.existingSecret }}
                  key: {{ .Values.backend.slack.existingSecretBotTokenKey | default "SLACK_BOT_TOKEN" }}
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.slack.existingSecret }}
                  key: {{ .Values.backend.slack.existingSecretAppTokenKey | default "SLACK_APP_TOKEN" }}
            {{- end }}
            {{- if .Values.models.openrouter.existingSecret }}
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.models.openrouter.existingSecret }}
                  key: {{ .Values.models.openrouter.existingSecretKey | default "OPENROUTER_API_KEY" }}
            {{- end }}
            {{- if .Values.models.anthropic.existingSecret }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.models.anthropic.existingSecret }}
                  key: {{ .Values.models.anthropic.existingSecretKey | default "ANTHROPIC_API_KEY" }}
            {{- end }}
            {{- if .Values.models.openai.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.models.openai.existingSecret }}
                  key: {{ .Values.models.openai.existingSecretKey | default "OPENAI_API_KEY" }}
            {{- end }}
            {{- if .Values.models.deepseek.existingSecret }}
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.models.deepseek.existingSecret }}
                  key: {{ .Values.models.deepseek.existingSecretKey | default "DEEPSEEK_API_KEY" }}
            {{- end }}
            {{- if .Values.models.gemini.existingSecret }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.models.gemini.existingSecret }}
                  key: {{ .Values.models.gemini.existingSecretKey | default "GEMINI_API_KEY" }}
            {{- end }}
            {{- if .Values.github.existingSecret }}
              {{- if .Values.github.existingSecretAppIdKey }}
            - name: GITHUB_APP_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: {{ .Values.github.existingSecretAppIdKey }}
              {{- end }}
              {{- if .Values.github.existingSecretPrivateKeyKey }}
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: {{ .Values.github.existingSecretPrivateKeyKey }}
              {{- end }}
              {{- if .Values.github.existingSecretWebhookSecretKey }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.github.existingSecret }}
                  key: {{ .Values.github.existingSecretWebhookSecretKey }}
              {{- end }}
            {{- end }}
            {{- if .Values.backend.extraEnv }}
            {{- toYaml .Values.backend.extraEnv | nindent 12 }}
            {{- end }}
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ .Values.backend.probes.startup.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.startup.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.backend.probes.startup.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.backend.probes.startup.failureThreshold | default 30 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.liveness.path | default "/health" }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.liveness.initialDelaySeconds | default 10 }}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.backend.probes.liveness.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold | default 3 }}
          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readiness.path | default "/v1/ready" }}
              port: http
            initialDelaySeconds: {{ .Values.backend.probes.readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds | default 5 }}
            timeoutSeconds: {{ .Values.backend.probes.readiness.timeoutSeconds | default 3 }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold | default 2 }}
          lifecycle:
            preStop:
              exec:
                command:
                  {{- toYaml .Values.backend.lifecycle.preStop.exec.command | nindent 18 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
