{{- if .Values.backend.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "rocket-chat.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rocket-chat.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "rocket-chat.fullname" . }}-backend
  # Replicas share the event stream and approval/cancel decisions through PostgreSQL
  # (backend.eventBus), so any replica can serve any session.
  minReplicas: {{ .Values.backend.autoscaling.minReplicas | default 1 }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas | default 4 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage | default 70 }}
{{- end }}
