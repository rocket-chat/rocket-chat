{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rocket-chat.fullname" . }}-sandbox-controller
  namespace: {{ .Values.sandbox.namespace | default "agent-sandboxes" }}
  labels:
    {{- include "rocket-chat.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # Per-sandbox egress policies for organizations that restrict where their sandboxes connect.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "update", "delete"]
  # Whole-workspace snapshots (CSI VolumeSnapshot), taken and restored by the sandbox driver.
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rocket-chat.fullname" . }}-sandbox-controller-binding
  namespace: {{ .Values.sandbox.namespace | default "agent-sandboxes" }}
  labels:
    {{- include "rocket-chat.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rocket-chat.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rocket-chat.fullname" . }}-sandbox-controller
{{- end }}
