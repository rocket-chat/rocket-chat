apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rocket-chat.fullname" . }}-config
  labels:
    {{- include "rocket-chat.labels" . | nindent 4 }}
data:
  DEFAULT_SANDBOX_DRIVER: {{ .Values.backend.env.DEFAULT_SANDBOX_DRIVER | default "k8s" | quote }}
  ROCKET_DEFAULT_MODEL: {{ .Values.backend.env.ROCKET_DEFAULT_MODEL | quote }}
  K8S_SANDBOX_NAMESPACE: {{ .Values.sandbox.namespace | default "agent-sandboxes" | quote }}
  K8S_STORAGE_CLASS: {{ .Values.sandbox.storageClass | default "" | quote }}
  NEXT_PUBLIC_API_URL: {{ printf "http://%s/api" .Values.global.domain | quote }}
  NEXT_PUBLIC_WS_URL: {{ printf "ws://%s/ws" .Values.global.domain | quote }}
  BACKEND_URL: {{ printf "http://%s-backend:%d" (include "rocket-chat.fullname" .) (.Values.backend.service.port | default 8000 | int) | quote }}
