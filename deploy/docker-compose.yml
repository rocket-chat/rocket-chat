# Evaluation stack: everything on one machine with throwaway credentials. NOT for production -
# use docker-compose.prod.yml (required secrets, ENVIRONMENT=production, no dev login).
name: rocket-chat

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rocket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rocket_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_prod_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-rls.sql:/docker-entrypoint-initdb.d/init-rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rocket_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runs command (stdio) MCP servers away from the API (database credentials, master key) and the
  # agent sandboxes. Not published on the host: only the backend reaches it.
  mcp-runner:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.mcp-runner
    image: ghcr.io/rocket-chat/mcp-runner:latest
    container_name: rocket_mcp_runner
    restart: unless-stopped
    environment:
      MCP_RUNNER_TOKEN: ${MCP_RUNNER_TOKEN:-eval-mcp-runner-token-0123456789}
    volumes:
      - mcp_runner_cache:/cache
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.backend
    image: ghcr.io/rocket-chat/backend:latest
    container_name: rocket_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # EVALUATION STACK ONLY: throwaway secrets and the one-click developer login. For anything
      # reachable by other people use docker-compose.prod.yml, which requires real secrets.
      ROCKET_DEV_LOGIN: "true"
      DATABASE_URL: postgresql+asyncpg://rocket_app:${POSTGRES_PASSWORD:-postgres_prod_password}@postgres:5432/rocket_chat
      ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres_prod_password}@postgres:5432/rocket_chat
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      DEFAULT_SANDBOX_DRIVER: docker
      MCP_RUNNER_URL: http://mcp-runner:8100
      MCP_RUNNER_TOKEN: ${MCP_RUNNER_TOKEN:-eval-mcp-runner-token-0123456789}
      ROCKET_DEFAULT_MODEL: ${ROCKET_DEFAULT_MODEL:-openrouter/deepseek/deepseek-v4.1-flash}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # Local Docker driver requires Docker socket access. In production Kubernetes driver (DEFAULT_SANDBOX_DRIVER=k8s), no host socket is mounted.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      mcp-runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    image: ghcr.io/rocket-chat/frontend:latest
    container_name: rocket_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-changeme_in_production_secret_key_32chars}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  mcp_runner_cache:
