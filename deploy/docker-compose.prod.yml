# Single-node production stack. Unlike docker-compose.yml (an evaluation stack with throwaway
# defaults) this file refuses to start without real secrets and runs the API in
# ENVIRONMENT=production, where development logins and trusted proxy headers are off.
#
#   cp deploy/.env.example deploy/.env      # then fill every REQUIRED value
#   docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d
name: rocket-chat

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rocket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rocket_chat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (openssl rand -hex 24)}
      ROCKET_APP_DB_PASSWORD: ${ROCKET_APP_DB_PASSWORD:?set ROCKET_APP_DB_PASSWORD, the password of the unprivileged API role (openssl rand -hex 24)}
    # No published port: only the backend, on the compose network, talks to the database.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-rls.sh:/docker-entrypoint-initdb.d/init-rls.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rocket_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.backend
    image: ghcr.io/rocket-chat/backend:latest
    container_name: rocket_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://rocket_app:${ROCKET_APP_DB_PASSWORD}@postgres:5432/rocket_chat
      ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/rocket_chat
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?set ENCRYPTION_MASTER_KEY (openssl rand -hex 32)}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET, at least 32 characters (openssl rand -hex 32)}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DEFAULT_SANDBOX_DRIVER: docker
      ROCKET_DEFAULT_MODEL: ${ROCKET_DEFAULT_MODEL:-openrouter/deepseek/deepseek-v4.1-flash}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL to the public https URL of the web app}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      # Password sign-in for installs without an identity provider (argon2id hashes, lock-out
      # after repeated failures). Set LOCAL_AUTH_ENABLED=false when you use only SSO.
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # SECURITY: the Docker sandbox driver creates containers through the host's Docker
      # daemon, which is equivalent to root on this machine for anyone who controls the
      # backend. For multi-user or internet-facing installs use the Kubernetes driver
      # (DEFAULT_SANDBOX_DRIVER=k8s, see the Helm chart) and drop this mount.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL (public URL of the API)}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?set NEXT_PUBLIC_WS_URL (public ws(s) URL of the API)}
    image: ghcr.io/rocket-chat/frontend:latest
    container_name: rocket_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # One secret signs the shared session cookie in both services.
      NEXTAUTH_SECRET: ${SESSION_SECRET}
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      BACKEND_URL: http://backend:8000
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
