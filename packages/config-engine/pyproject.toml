[project]
name = "config-engine"
version = "0.1.4"
description = "Hierarchical Configuration & Policy Engine for Rocket Chat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43.0.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config_engine"]
