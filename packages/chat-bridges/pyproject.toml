[project]
name = "chat-bridges"
version = "0.7.2"
description = "Microsoft Teams and Mattermost for Rocket Chat, through one chat bridge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.8.0",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_bridges"]
