[project]
name = "sandbox-driver"
version = "0.1.0"
description = "Pluggable isolated sandbox execution driver for Rocket Chat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1.0",
    "kubernetes_asyncio>=24.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_driver"]
