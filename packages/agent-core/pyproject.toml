[project]
name = "agent-core"
version = "0.1.2"
description = "Autonomous Agent Engine and Two-Tier FastMCP Tool Server for Rocket Chat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.13.0",
    "sandbox-driver",
    "llm-gateway",
    "litellm>=1.103.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_core"]
