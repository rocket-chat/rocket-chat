[project]
name = "slack-assistant"
version = "0.1.1"
description = "Native Slack Assistant Integration for Rocket Chat using Socket Mode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "slack-bolt>=1.20.0",
    "aiohttp>=3.9.0",
    "agent-core",
    "sandbox-driver",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_assistant"]
